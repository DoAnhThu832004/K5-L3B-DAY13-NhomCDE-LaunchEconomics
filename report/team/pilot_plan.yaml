# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu/nhóm (42 người/nhóm, tổng 84 > 40: không đủ người)
#   c) 20 nhân viên mỗi nhóm: giới hạn c / ICC = 20 / 0,02 = tối đa 1.000 < 1.251 (không đạt cho 5 điểm)
#   d) 6 depot mỗi nhóm: giới hạn 6 / 0,02 = tối đa 300 (không đạt và dưới 20 cụm)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu/người (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có — 20 nhân viên đối chứng làm cùng tuần, cùng 12 depot với 20 nhân viên can thiệp.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên 20+20 bằng code với seed chốt trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng khóa quyền theo tài khoản staff_id và log lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có — chỉ số chính, MDE 0,06, 3 luật dừng và ngày quyết định 2027-01-05 chốt trước ngày chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: Có — đúng 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện): Chọn chia theo nhân viên (20 + 20), chấp nhận MDE 6 điểm (n=859/nhóm, m>=299); nếu tác động thật chỉ 5 điểm thì power giảm còn ~0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: Hiện tại 4,25% toàn mẫu (51/1.200) và 3,97% trong phạm vi noi_dia + hang_nang; chọn ngưỡng so với đối chứng (cao hơn >= 2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"                      # một người có tên vai trò, không ghi "cả đội"
  scope: "Chỉ áp dụng cho noi_dia (0,22x) và hang_nang (0,69x), simulated trên 12 depot; loại bỏ quoc_te (1,88x) và doi_tac (0,85x)"                      # loại yêu cầu nào, depot nào; dựa vào kết quả A3
  assignment:
    unit: "staff"                     # request | staff | depot
