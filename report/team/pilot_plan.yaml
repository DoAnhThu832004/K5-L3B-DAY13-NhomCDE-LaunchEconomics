    - "NẾU tỉ lệ nhân viên bỏ qua hoặc sửa gợi ý (sua + bo) vượt quá 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn trực tiếp 5 nhân viên trong 3 ngày để rà quy trình và mẫu câu trả lời KHÔNG THÌ không được tăng tỉ lệ rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
